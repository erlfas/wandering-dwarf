<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endless Procedural World — Phase 1 (Blank Terrain)</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Compass & HUD matching concept art layout -->
    <div id="hud">
      <div id="compass-container" title="Compass">
        <div class="compass-label north">N</div>
        <div class="compass-label east">E</div>
        <div class="compass-label south">S</div>
        <div class="compass-label west">W</div>
        <div id="compass-needle">
          <div class="needle-north"></div>
          <div class="needle-south"></div>
        </div>
        <div id="compass-chest-pointer" title="Nearest Chest Direction"></div>
      </div>

      <!-- Treasure Score & Nearest Chest Tracker -->
      <div id="treasure-hud">
        <div class="chest-icon">🪙</div>
        <div class="treasure-details">
          <div class="score-row">
            <span id="score-value">0</span>
            <span class="score-unit">GOLD</span>
            <span id="streak-badge" class="hidden">🔥 1.5x</span>
            <button id="relic-shop-toggle" type="button" title="Toggle Dwarven Relics (B)">
              ⚒️ Relics (B)
            </button>
          </div>
          <div class="sub-row">
            <span id="chests-value">0 Chests</span>
            <span class="dot-sep">•</span>
            <span id="nearest-chest-hint">Scanning...</span>
          </div>
        </div>
      </div>

      <!-- Active Traversal Status Pill (Trailblazer / Gliding / Slope Surfing) -->
      <div id="movement-status-pill" class="hidden"></div>

      <!-- Dwarven Relic Upgrades Shop (collapsed by default so it never clutters the screen) -->
      <div id="relic-shop" class="collapsed">
        <div class="relic-shop-header">
          <span>⚒️ RELICS</span>
          <span class="relic-shop-sub">Keys 1–4</span>
        </div>
        <div id="relic-list"></div>
      </div>

      <!-- Unlocked Watchtower Beacons (Fast-Travel Waypoints) -->
      <div id="waypoint-bar" class="hidden">
        <div class="waypoint-header">🔥 BEACON WAYPOINTS (<kbd>T</kbd> Cycle)</div>
        <div id="waypoint-list"></div>
      </div>

      <!-- Floating Pickup Toasts -->
      <div id="pickup-toasts"></div>

      <div id="stats-badge">
        <div class="badge-header">
          <div class="badge-title">PHASE 3: FOREST GROVES, PONDS &amp; RIVERS</div>
          <button id="music-toggle" type="button" title="Toggle Background Music (P)">
            ♪ Wandering Through the Pines
          </button>
        </div>
        <div id="coords-readout">Pos: (0, 0) | Elev: 0.0m | Chunks: 0</div>
        <div class="controls-hint">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move</span>
          <span><kbd>Shift</kbd> Sprint</span>
          <span><kbd>Space</kbd> Jump / Glide</span>
          <span><kbd>C</kbd>/<kbd>Ctrl</kbd> Surf Slope / Dash</span>
          <span><kbd>1</kbd>-<kbd>4</kbd> Buy Relic</span>
          <span><kbd>B</kbd> Forge</span>
          <span><kbd>T</kbd> Waypoint</span>
          <span><kbd>N</kbd> Day/Night</span>
          <span><kbd>V</kbd> View</span>
          <span><kbd>P</kbd> Music</span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
